# Included in the http context. Replace server_name with your actual domain.
map $request_method $ugk_login_key { default ""; POST $binary_remote_addr; }
limit_req_zone $ugk_login_key zone=ugk_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ugk_api:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=ugk_connections:10m;
server {
    listen 80;
    server_name schedule.example.com;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    location = /admin/login {
        limit_req zone=ugk_login burst=5 nodelay;
        limit_conn ugk_connections 10;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/public/ {
        limit_req zone=ugk_api burst=100 nodelay;
        limit_conn ugk_connections 50;
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
# Add allow/deny for your real LAN/VPN in BOTH /admin and /api/admin locations.
# For HTTPS run certbot --nginx after DNS and port 80 are reachable.
# Behind a tunnel/CDN configure only explicitly trusted real-IP upstreams.
