name: Build and deploy
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ugk_test
          POSTGRES_USER: ugk_test
          POSTGRES_PASSWORD: integration-only-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ugk_test -d ugk_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      UGK_TEST_DB_URL: jdbc:postgresql://localhost:5432/ugk_test
      UGK_TEST_DB_USERNAME: ugk_test
      UGK_TEST_DB_PASSWORD: integration-only-secret
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Java and PostgreSQL integration tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: JavaScript tests
        run: node --test src/test/js/*.test.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application
          path: target/*.jar
          retention-days: 7
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application
          path: artifact
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST}"
          : "${VPS_USER:?Set VPS_USER}"
          port="${VPS_PORT:-22}"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          jars=(artifact/*.jar)
          test "${#jars[@]}" -eq 1
          scp "${opts[@]}" -P "$port" "${jars[0]}" "$VPS_USER@$VPS_HOST:/opt/ugk-schedule/app.jar.next"
          ssh "${opts[@]}" -p "$port" "$VPS_USER@$VPS_HOST" 'bash -se' < deploy/deploy.sh
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
