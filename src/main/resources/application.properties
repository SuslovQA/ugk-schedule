spring.application.name=ugk-schedule
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
app.logging.directory=${APP_LOG_DIR:./logs}
app.logging.max-file-size=${APP_LOG_MAX_FILE_SIZE:10MB}
app.logging.history-days=${APP_LOG_HISTORY_DAYS:0}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ugk_schedule}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.thymeleaf.cache=false

app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.miniapp.url=${MINIAPP_URL:}
app.miniapp.request-logging=${MINIAPP_REQUEST_LOGGING:false}
app.telegram.token=${TELEGRAM_BOT_TOKEN:}
app.telegram.poll-delay-ms=${TELEGRAM_POLL_DELAY_MS:1500}
app.max.token=${MAX_BOT_TOKEN:}
app.max.poll-delay-ms=${MAX_POLL_DELAY_MS:2000}

# This trust bundle is used only by maxRestClient, not by Telegram or the JVM globally.
spring.ssl.bundle.pem.max.truststore.certificate=${MAX_CA_CERTIFICATE:classpath:certs/russian_trusted_root_ca.cer}
