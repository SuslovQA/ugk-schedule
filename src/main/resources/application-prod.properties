# Activate explicitly with SPRING_PROFILES_ACTIVE=prod.
app.production.enforce-secret-policy=${APP_ENFORCE_SECRET_POLICY:false}
server.address=127.0.0.1
server.forward-headers-strategy=native
spring.thymeleaf.cache=true
spring.task.scheduling.pool.size=2
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=15s
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=100
server.tomcat.max-connections=1000
server.tomcat.connection-timeout=10s
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=30
app.admin.password=${APP_ADMIN_PASSWORD:}
spring.datasource.password=${DB_PASSWORD:}
