<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Администрирование</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header><strong>UGK Schedule</strong><nav><a href="/admin">Справочники</a><a href="/admin/schedule">Расписание</a><form method="post" th:action="@{/admin/logout}"><button class="link-button">Выйти</button></form></nav></header>
<main class="container"><h1>Настройки расписания</h1><div th:if="${message}" class="success" th:text="${message}"></div><div th:if="${error}" class="error" th:text="${error}"></div>
<section class="panel"><h2>Уровни образования</h2><form class="inline-form" method="post" th:action="@{/admin/levels}"><input name="name" placeholder="Название" required><input name="maxCourses" type="number" min="1" max="10" placeholder="Курсов" required><input name="sortOrder" type="number" value="0"><label><input type="checkbox" name="active" value="true" checked> Активен</label><button>Добавить</button></form>
<table><tr><th>Название</th><th>Макс. курсов</th><th>Порядок</th><th>Активен</th><th></th></tr><tr th:each="x:${levels}"><td colspan="5"><form class="row-edit" method="post" th:action="@{/admin/levels}"><input type="hidden" name="id" th:value="${x.id}"><input name="name" th:value="${x.name}" required><input name="maxCourses" type="number" min="1" max="10" th:value="${x.maxCourses}" required><input name="sortOrder" type="number" th:value="${x.sortOrder}"><label><input type="checkbox" name="active" value="true" th:checked="${x.active}"> Активен</label><button>Сохранить</button></form><form class="delete-form" th:action="@{'/admin/levels/'+${x.id}+'/delete'}" method="post"><button class="danger">Удалить</button></form></td></tr></table></section>
<section class="panel"><h2>Курсы</h2><form class="inline-form" method="post" th:action="@{/admin/courses}"><select name="levelId" required><option value="">Уровень</option><option th:each="x:${levels}" th:value="${x.id}" th:text="${x.name}"></option></select><input name="number" type="number" min="1" max="10" placeholder="№" required><input name="name" placeholder="Название, например 2 курс" required><label><input type="checkbox" name="active" value="true" checked> Активен</label><button>Добавить</button></form>
<table><tr><th colspan="2">Редактирование</th></tr><tr th:each="x:${courses}"><td><form class="row-edit" method="post" th:action="@{/admin/courses}"><input type="hidden" name="id" th:value="${x.id}"><select name="levelId" required><option th:each="l:${levels}" th:value="${l.id}" th:text="${l.name}" th:selected="${l.id==x.educationLevel.id}"></option></select><input name="number" type="number" min="1" max="10" th:value="${x.number}" required><input name="name" th:value="${x.name}" required><label><input type="checkbox" name="active" value="true" th:checked="${x.active}"> Активен</label><button>Сохранить</button></form></td><td><form th:action="@{'/admin/courses/'+${x.id}+'/delete'}" method="post"><button class="danger">Удалить</button></form></td></tr></table></section>
<section class="panel"><h2>Группы / направления</h2><form class="inline-form" method="post" th:action="@{/admin/groups}"><select name="courseId" required><option value="">Курс</option><option th:each="x:${courses}" th:value="${x.id}" th:text="${x.educationLevel.name+' — '+x.name}"></option></select><input name="name" placeholder="ДХО, ОНИ..." required><label><input type="checkbox" name="active" value="true" checked> Активна</label><button>Добавить</button></form>
<table><tr><th>Редактирование</th><th></th></tr><tr th:each="x:${groups}"><td><form class="row-edit" method="post" th:action="@{/admin/groups}"><input type="hidden" name="id" th:value="${x.id}"><select name="courseId" required><option th:each="c:${courses}" th:value="${c.id}" th:text="${c.educationLevel.name+' — '+c.name}" th:selected="${c.id==x.course.id}"></option></select><input name="name" th:value="${x.name}" required><label><input type="checkbox" name="active" value="true" th:checked="${x.active}"> Активна</label><button>Сохранить</button></form></td><td><form th:action="@{'/admin/groups/'+${x.id}+'/delete'}" method="post"><button class="danger">Удалить</button></form></td></tr></table></section></main></body></html>
