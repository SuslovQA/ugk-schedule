<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Вход</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
<form class="login-card" method="post" th:action="@{/admin/login}"><h1>Расписание УГК</h1>
    <p>Административная панель</p><label>Логин<input name="username" required autofocus></label><label>Пароль<input
            name="password" type="password" required></label>
    <button>Войти</button>
    <div class="error" th:if="${param.error}">Неверный логин или пароль</div>
    <div class="success" th:if="${param.logout}">Вы вышли из системы</div>
</form>
</body>
</html>
